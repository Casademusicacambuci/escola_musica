<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa PDV - Casa de Música Cambuci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; }
        .cupom-fiscal { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 400px; }
        .table-pdv th, .table-pdv td { font-size: 0.9rem; }
        .total-display { font-size: 2.5rem; font-weight: bold; color: #198754; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-warning mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-dark" href="/dashboard">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" height="30" class="me-2 rounded bg-white p-1">
                <span>&larr; Voltar | <strong>Caixa Livre (PDV)</strong></span>
            </a>
            <span class="navbar-text text-dark fw-bold">
                Operador: {{ session.nome }}
            </span>
        </div>
    </nav>

    <div class="container mb-5">
        
        <div class="row">
            <!-- ÁREA DE BUSCA (LEITOR DE CÓDIGO) -->
            <div class="col-lg-7 mb-4">
                <div class="card shadow-sm border-0 border-top border-warning border-3 mb-3">
                    <div class="card-body bg-light">
                        <label class="form-label fw-bold text-dark fs-5">Código de Barras ou Interno</label>
                        <div class="input-group input-group-lg">
                            <input type="text" class="form-control border-warning" id="codigoInput" placeholder="Bipe ou digite o código e aperte Enter..." autofocus>
                            <button class="btn btn-warning fw-bold" type="button" onclick="buscarProduto()">Inserir</button>
                        </div>
                        <small class="text-muted mt-2 d-block">Dica: O leitor USB já aperta 'Enter' automaticamente.</small>
                    </div>
                </div>

                <!-- PAGAMENTO -->
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title text-secondary">Finalizar Venda</h5>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="small fw-bold">Forma de Pagamento</label>
                                <select class="form-select form-select-lg" id="formaPagamento">
                                    <option value="Pix">Pix (QR Code / Transferência)</option>
                                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                                    <option value="Cartão de Débito">Cartão de Débito</option>
                                    <option value="Dinheiro">Dinheiro (Espécie)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="small fw-bold">CPF na Nota (Opcional)</label>
                                <input type="text" class="form-control form-control-lg" id="cpfCliente" placeholder="000.000.000-00">
                            </div>
                        </div>
                        <button class="btn btn-success btn-lg w-100 fw-bold" onclick="finalizarVenda()">COBRAR E FINALIZAR</button>
                    </div>
                </div>
            </div>

            <!-- CUPOM / CARRINHO DE COMPRAS -->
            <div class="col-lg-5">
                <div class="cupom-fiscal d-flex flex-column">
                    <div class="text-center mb-3">
                        <h5 class="mb-0 fw-bold">CUPOM DE VENDA</h5>
                        <small class="text-muted">Casa de Música Cambuci</small>
                    </div>
                    
                    <div class="table-responsive flex-grow-1">
                        <table class="table table-sm table-pdv table-borderless border-bottom">
                            <thead>
                                <tr class="border-bottom">
                                    <th>Qtd</th>
                                    <th>Produto</th>
                                    <th class="text-end">Preço (R$)</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="listaItens">
                                <!-- Os itens bipados aparecerão aqui via JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-auto border-top pt-3 text-end">
                        <h6 class="text-muted mb-0">TOTAL A PAGAR</h6>
                        <div class="total-display" id="valorTotal">R$ 0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DO PDV (A MÁGICA DA TELA) -->
    <script>
        let carrinho = [];
        let total = 0.0;
        const inputCodigo = document.getElementById('codigoInput');

        // Fica escutando o "Enter" do leitor de código de barras
        inputCodigo.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                buscarProduto();
            }
        });

        function buscarProduto() {
            const codigo = inputCodigo.value.trim();
            if(!codigo) return;

            // Chama a API do nosso sistema (app.py) escondido
            fetch(`/api/produto/${codigo}`)
                .then(response => response.json())
                .then(produto => {
                    if (produto.erro) {
                        alert(produto.erro);
                    } else {
                        adicionarAoCarrinho(produto);
                    }
                    inputCodigo.value = '';
                    inputCodigo.focus();
                });
        }

        function adicionarAoCarrinho(produto) {
            // Verifica se o item já está no carrinho para somar a quantidade
            let itemExistente = carrinho.find(i => i.id === produto.id);
            if (itemExistente) {
                itemExistente.quantidade += 1;
            } else {
                carrinho.push({
                    id: produto.id,
                    nome: produto.nome,
                    preco: produto.preco,
                    quantidade: 1
                });
            }
            atualizarTela();
        }

        function removerDoCarrinho(index) {
            carrinho.splice(index, 1);
            atualizarTela();
            inputCodigo.focus();
        }

        function atualizarTela() {
            const tbody = document.getElementById('listaItens');
            tbody.innerHTML = '';
            total = 0.0;

            carrinho.forEach((item, index) => {
                let subtotal = item.quantidade * item.preco;
                total += subtotal;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.quantidade}x</td>
                    <td>${item.nome}</td>
                    <td class="text-end">${subtotal.toFixed(2)}</td>
                    <td class="text-end"><button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removerDoCarrinho(${index})">X</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('valorTotal').innerText = `R$ ${total.toFixed(2)}`;
        }

        function finalizarVenda() {
            if (carrinho.length === 0) {
                alert("O carrinho está vazio!");
                return;
            }

            const formaPgto = document.getElementById('formaPagamento').value;
            const cpf = document.getElementById('cpfCliente').value;

            const dadosVenda = {
                itens: carrinho,
                total: total,
                forma_pagamento: formaPgto,
                cpf: cpf
            };

            // Envia a venda para o Banco de Dados (app.py)
            fetch('/caixa/finalizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosVenda)
            })
            .then(response => response.json())
            .then(data => {
                if (data.sucesso) {
                    alert("✅ Venda finalizada com sucesso! O valor já foi para o Financeiro.");
                    carrinho = [];
                    atualizarTela();
                    document.getElementById('cpfCliente').value = '';
                    inputCodigo.focus();
                } else {
                    alert("Erro ao finalizar venda.");
                }
            });
        }
    </script>
</body>
</html>
