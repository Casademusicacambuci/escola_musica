<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Música Cambuci - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="mb-4">🎵 Cambuci Gestão</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} p-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">Usuário</label>
                <input type="text" name="usuario" class="form-control" required placeholder="Ex: admin">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
